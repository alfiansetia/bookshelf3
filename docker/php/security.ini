; Mitigasi CVE-2026-115560 (RCE via session upload progress, belum ada patch
; saat rilis ini; ditangani di release reguler berikutnya).
; Aplikasi ini tidak memakai fitur upload progress, jadi aman dimatikan.
; Disarankan PHP tetap di versi patched PHP2Shell (CVE-2026-109618/109619):
; PHP >= 8.4.27 (lihat FROM di Dockerfile).
session.upload_progress.enabled = 0
