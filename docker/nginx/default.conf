server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Security headers (prod-safe, tidak merusak Inertia/Vite).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP via service php-fpm (nama service di compose)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass bookshelf-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;

        # Buffer header bawaan nginx hanya 4k (seukuran page memori). Halaman
        # Inertia mengirim SATU header `Link` besar berisi seluruh aset preload
        # halaman itu, karena resources/views/app.blade.php menambahkan
        # "resources/js/pages/{komponen}" ke @vite sehingga graf chunk halaman
        # ikut dipreload. Halaman rak publik graf-nya paling besar: 37 entri
        # (~3,7 kB). Ditambah Set-Cookie (~0,9 kB) total header lewat 4 kB, dan
        # nginx membalas 502 "upstream sent too big header while reading response
        # header from upstream" — di Cloudflare tampil sebagai error 502.
        # Halaman kecil (/jelajah) hanya lolos karena header-nya ~4,0 kB.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;

        # Selaras dengan max_execution_time 120 di docker/php/uploads.ini
        fastcgi_read_timeout 120s;
    }

    # Service worker: JANGAN cache lama — update harus langsung sampai ke klien.
    # add_header di location menimpa header warisan dari server, jadi header
    # keamanan perlu diulang di sini.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.php?$query_string;
    }

    # Manifest PWA. mime.types bawaan image nginx belum memetakan ekstensi
    # .webmanifest, sehingga tanpa default_type berkas ini terkirim sebagai
    # application/octet-stream dan sebagian browser menolak memasang PWA.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static assets: cache lama, tanpa access log
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Blokir file tersembunyi (kecuali .well-known untuk ACME/challenge)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
