server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 50M;

    # Security headers (prod-safe, tidak merusak Inertia/Vite).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP via service php-fpm (nama service di compose)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass bookshelf-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        # Selaras dengan max_execution_time 120 di docker/php/uploads.ini
        fastcgi_read_timeout 120s;
    }

    # Service worker + manifest: JANGAN cache lama — update harus langsung sampai ke klien.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache";
        try_files $uri /index.php?$query_string;
    }
    location = /manifest.json {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Static assets: cache lama, tanpa access log
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Blokir file tersembunyi (kecuali .well-known untuk ACME/challenge)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
