name: Deploy to VPS

# Auto-deploy: jalan otomatis setiap push ke main. Manual via tab Actions tetap bisa.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # NOTE: input `script_stop` sudah DIHAPUS di appleboy/ssh-action v1.2.x.
          # Penggantinya: `set -e` di awal script di bawah (per README-nya).
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}

            # .env wajib ada karena laravel membaca lewat mount, bukan env_file.
            if [ ! -f .env ]; then
              echo "ERROR: .env belum ada di server (cp .env.example .env lalu isi)." >&2
              exit 1
            fi

            # Network dipakai bersama stack mysql + cloudflared. Idempoten:
            # kalau sudah ada, perintah ini tidak melakukan apa-apa.
            docker network create app-network 2>/dev/null || true

            git fetch origin main
            git reset --hard origin/main

            # --build wajib: source + vite build ikut di-bake ke image (COPY . .),
            # tanpa ini container jalan dengan kode lama.
            # --wait: tunggu healthcheck lolos, jadi migrate tidak balapan start.
            # bookshelf-web ikut ter-recreate otomatis karena satu image.
            # --remove-orphans: bersihkan container lama (mis. worker/scheduler) yang sudah dihapus.
            docker compose up -d --build --remove-orphans --wait

            # -T: tanpa TTY (SSH non-interaktif). -u www-data: agar file
            # cache/migrate milik www-data, bukan root.
            docker compose exec -T -u www-data bookshelf-app php artisan migrate --force
            docker compose exec -T -u www-data bookshelf-app php artisan optimize
            docker compose ps
