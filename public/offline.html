<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex, nofollow">
        <title>Sedang offline — Rak Buku</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <style>
            :root {
                color-scheme: light dark;
                --background: hsl(40 30% 98%);
                --card: hsl(0 0% 100%);
                --foreground: hsl(28 20% 12%);
                --muted: hsl(28 12% 42%);
                --primary: hsl(163 62% 25%);
                --primary-foreground: hsl(150 45% 97%);
                --border: hsl(36 20% 88%);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --background: hsl(200 12% 8%);
                    --card: hsl(200 12% 11%);
                    --foreground: hsl(40 30% 96%);
                    --muted: hsl(200 8% 65%);
                    --primary: hsl(160 52% 60%);
                    --primary-foreground: hsl(200 30% 10%);
                    --border: hsl(200 10% 20%);
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                align-items: center;
                background-color: var(--background);
                color: var(--foreground);
                display: flex;
                font-family:
                    ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                    "Helvetica Neue", Arial, sans-serif;
                justify-content: center;
                margin: 0;
                min-height: 100vh;
                padding: 1.5rem;
                -webkit-font-smoothing: antialiased;
            }

            main {
                background-color: var(--card);
                border: 1px solid var(--border);
                border-radius: 1.5rem;
                max-width: 26rem;
                padding: 2.5rem 1.75rem;
                text-align: center;
                width: 100%;
            }

            .badge {
                align-items: center;
                background-color: color-mix(in srgb, var(--primary) 12%, transparent);
                border-radius: 999px;
                color: var(--primary);
                display: inline-flex;
                font-size: 0.75rem;
                font-weight: 600;
                gap: 0.375rem;
                padding: 0.25rem 0.75rem;
            }

            h1 {
                font-size: 1.5rem;
                line-height: 1.25;
                margin: 1.25rem 0 0.5rem;
            }

            p {
                color: var(--muted);
                font-size: 0.9375rem;
                line-height: 1.6;
                margin: 0;
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                justify-content: center;
                margin-top: 1.75rem;
            }

            a {
                border-radius: 0.5rem;
                font-size: 0.875rem;
                font-weight: 500;
                padding: 0.5rem 1rem;
                text-decoration: none;
            }

            .primary {
                background-color: var(--primary);
                color: var(--primary-foreground);
            }

            .secondary {
                border: 1px solid var(--border);
                color: var(--foreground);
            }
        </style>
    </head>
    <body>
        <main>
            <span class="badge">Sedang offline</span>
            <h1>Koneksi internet terputus</h1>
            <p>
                Halaman ini belum tersimpan untuk dibuka tanpa jaringan. Periksa
                koneksimu, lalu coba muat ulang.
            </p>
            <div class="actions">
                <a class="primary" href="" onclick="window.location.reload(); return false;">
                    Coba lagi
                </a>
                <a class="secondary" href="/">Ke beranda</a>
            </div>
        </main>
    </body>
</html>
